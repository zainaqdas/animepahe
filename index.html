<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
<title>AnimeFlow — Watch Anime Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
/* ── Reset & Base ─────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;
  --bg2:#18181f;
  --bg3:#20202a;
  --surface:#2a2a36;
  --surface-hover:#353545;
  --border:#333344;
  --text:#e8e8f0;
  --text2:#9898b0;
  --text3:#6a6a80;
  --accent:#7c5cfc;
  --accent-hover:#6a48e8;
  --accent-glow:rgba(124,92,252,0.25);
  --green:#4ade80;
  --yellow:#facc15;
  --red:#f87171;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,0.3);
}
html{font-size:15px}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  min-height:100vh;
}
a{color:var(--accent);text-decoration:none;transition:color .2s}
a:hover{color:var(--accent-hover)}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--surface);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--surface-hover)}

/* ── Layout ───────────────────────────── */
.app{max-width:1200px;margin:0 auto;padding:0 20px 60px}

/* ── Header ───────────────────────────── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);margin-bottom:28px;
}
.logo{
  font-size:1.4rem;font-weight:800;
  background:linear-gradient(135deg,#7c5cfc,#b96cfc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;white-space:nowrap;
}
.logo span{-webkit-text-fill-color:var(--text3);font-weight:400}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{
  padding:6px 16px;border-radius:20px;font-size:.85rem;font-weight:500;
  color:var(--text2);transition:all .2s;cursor:pointer;
}
nav a:hover,nav a.active{color:var(--text);background:var(--surface)}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:20px;padding:4px 16px 4px 4px;
  transition:border-color .2s;flex:1;min-width:200px;max-width:360px;
}
.search-box:focus-within{border-color:var(--accent)}
.search-box input{
  background:transparent;border:none;outline:none;
  color:var(--text);font-size:.85rem;padding:8px 4px;width:100%;
}
.search-box input::placeholder{color:var(--text3)}
.search-box button{
  background:var(--accent);border:none;border-radius:50%;
  width:30px;height:30px;color:#fff;font-size:.8rem;
  cursor:pointer;transition:background .2s;
  display:flex;align-items:center;justify-content:center;
}
.search-box button:hover{background:var(--accent-hover)}

/* ── Page Sections ─────────────────────── */
.page{display:none}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-title{
  font-size:1.2rem;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.section-title .count{
  font-size:.8rem;font-weight:400;color:var(--text3);
  background:var(--surface);padding:2px 10px;border-radius:10px;
}

/* ── Anime Grid ────────────────────────── */
.anime-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;margin-bottom:32px;
}
.anime-card{
  background:var(--bg2);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;
  border:1px solid var(--border);
}
.anime-card:hover{
  transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.4);
}
.anime-card .thumb{
  aspect-ratio:3/4;background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.anime-card .thumb img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .3s;
}
.anime-card:hover .thumb img{transform:scale(1.05)}
.anime-card .thumb .ep-badge{
  position:absolute;top:8px;right:8px;
  background:var(--accent);color:#fff;font-size:.7rem;font-weight:600;
  padding:2px 8px;border-radius:6px;
}
.anime-card .info{padding:10px 12px 12px}
.anime-card .info .title{
  font-size:.82rem;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.anime-card .info .meta{
  font-size:.72rem;color:var(--text3);margin-top:4px;
  display:flex;gap:6px;flex-wrap:wrap;
}
.anime-card .info .meta span{background:var(--surface);padding:1px 6px;border-radius:4px}

/* ── Episode Grid ───────────────────────── */
.episode-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:8px;margin-bottom:24px;
}
.episode-btn{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px;text-align:center;
  cursor:pointer;transition:all .2s;font-size:.82rem;font-weight:500;
  color:var(--text2);
}
.episode-btn:hover{background:var(--surface);color:var(--text);border-color:var(--accent)}
.episode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Watch Page ─────────────────────────── */
.watch-header{
  display:flex;gap:20px;margin-bottom:20px;align-items:flex-start;
  flex-wrap:wrap;
}
.watch-poster{
  width:100px;border-radius:var(--radius-sm);flex-shrink:0;
}
.watch-poster img{width:100%;border-radius:var(--radius-sm)}
.watch-info{flex:1;min-width:200px}
.watch-info h1{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.watch-info .meta{font-size:.82rem;color:var(--text2);margin-bottom:4px}
.player-wrapper{
  position:relative;width:100%;border-radius:var(--radius);
  overflow:hidden;margin-bottom:20px;
  background:#000;aspect-ratio:16/9;
}
.player-wrapper video{
  width:100%;height:100%;display:block;
}
.player-wrapper .loading-overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.7);z-index:5;
  transition:opacity .3s;
}
.player-wrapper .loading-overlay.hidden{opacity:0;pointer-events:none}
.player-wrapper .loading-overlay .spinner-lg{
  width:48px;height:48px;border:3px solid rgba(255,255,255,0.1);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin-bottom:12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.player-wrapper .loading-overlay .hint{font-size:.85rem;color:var(--text2)}
.err-msg{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.85);z-index:6;padding:20px;text-align:center;
}
.err-msg .icon{font-size:2rem;margin-bottom:8px}
.err-msg .text{font-size:.85rem;color:var(--red);max-width:400px}
.err-msg .retry{
  margin-top:12px;padding:8px 20px;border-radius:20px;
  background:var(--accent);color:#fff;border:none;cursor:pointer;
  font-family:inherit;font-size:.82rem;transition:background .2s;
}
.err-msg .retry:hover{background:var(--accent-hover)}

/* ── Stream Controls ───────────────────── */
.stream-controls{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;
}
.stream-controls select,.stream-controls .btn{
  background:var(--bg2);border:1px solid var(--border);
  color:var(--text);padding:8px 14px;border-radius:var(--radius-sm);
  font-size:.82rem;cursor:pointer;transition:all .2s;
  font-family:inherit;
}
.stream-controls select:hover,.stream-controls .btn:hover{
  background:var(--surface);border-color:var(--accent);
}
.stream-controls select{min-width:120px}
.stream-controls .btn-download{background:var(--accent);border-color:var(--accent);color:#fff}
.stream-controls .btn-download:hover{background:var(--accent-hover)}

/* ── Search Results ─────────────────────── */
.search-results-count{
  font-size:.85rem;color:var(--text2);margin-bottom:16px;
}

/* ── Loading & Empty States ─────────────── */
.loading{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;color:var(--text3);
}
.spinner{
  width:32px;height:32px;border:3px solid var(--surface);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin-bottom:12px;
}
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text3);
}
.empty-state .icon{font-size:2.5rem;margin-bottom:12px}

/* ── Back Button ────────────────────────── */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:500;
  color:var(--text2);background:var(--bg2);border:1px solid var(--border);
  cursor:pointer;transition:all .2s;margin-bottom:16px;
}
.back-btn:hover{color:var(--text);background:var(--surface);border-color:var(--accent)}

/* ── Responsive ─────────────────────────── */
@media(max-width:640px){
  .app{padding:0 12px 40px}
  .anime-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .episode-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .watch-header{flex-direction:column;gap:12px}
  .watch-poster{width:80px}
  .search-box{min-width:100%;max-width:100%}
  header{gap:10px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ═══ HEADER ═══ -->
  <header>
    <div class="logo" data-action="home" style="cursor:pointer">AnimeFlow <span>// watch</span></div>
    <nav>
      <a class="active" data-action="home" data-page="home">Home</a>
      <a data-action="search" data-page="search">Search</a>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search anime...">
      <button data-action="search-go">⌕</button>
    </div>
  </header>

  <!-- ═══ HOME PAGE ═══ -->
  <div class="page active" id="page-home">
    <div class="section-title">🍿 Latest Releases <span class="count" id="latestCount"></span></div>
    <div id="latestGrid" class="anime-grid"></div>
  </div>

  <!-- ═══ SEARCH PAGE ═══ -->
  <div class="page" id="page-search">
    <div class="section-title">🔍 Search Results</div>
    <div class="search-results-count" id="searchCount"></div>
    <div id="searchGrid" class="anime-grid"></div>
  </div>

  <!-- ═══ WATCH PAGE ═══ -->
  <div class="page" id="page-watch">
    <button class="back-btn" data-action="home">← Back</button>

    <div class="watch-header" id="watchHeader"></div>

    <div class="player-wrapper" id="playerWrapper">
      <video id="animeVideo" controls playsinline></video>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-lg"></div>
        <div class="hint">Loading stream...</div>
      </div>
    </div>

    <div class="stream-controls" id="streamControls"></div>

    <div class="section-title">📺 Episodes</div>
    <div id="episodeGrid" class="episode-grid"></div>
  </div>

</div>

<script>
// ─── State ────────────────────────────────
let state = {
  currentAnime: null,
  currentEpisode: null,
  currentStreams: [],
  currentM3u8: '',      // The proxied m3u8 URL
  currentRef: '',        // The referer for the stream
};
let hlsPlayer = null;    // Hls.js instance
let hlsRecoveryCount = 0;  // MEDIA_ERROR recovery attempts

// ─── API Helper ───────────────────────────
async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ─── Page Navigation ──────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pg = document.getElementById(`page-${name}`);
  if (pg) pg.classList.add('active');
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  const navEl = document.querySelector(`nav a[data-page="${name}"]`);
  if (navEl) navEl.classList.add('active');
  if (name === 'home') loadHome();
}

// ─── HOME ─────────────────────────────────
let homeLoaded = false;
async function loadHome() {
  if (homeLoaded) return;
  const grid = document.getElementById('latestGrid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div>Loading latest...</div>';
  try {
    const data = await api('/api/latest');
    const items = data.data || [];
    document.getElementById('latestCount').textContent = items.length;
    if (items.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No latest releases found</p></div>';
      return;
    }
    grid.innerHTML = items.map(item => `
      <div class="anime-card" data-action="anime" data-session="${escapeHtml(item.anime_session || item.session)}" data-title="${escapeHtml(item.anime_title || item.title)}">
        <div class="thumb">
          <img src="${item.poster ? 'https://i.animepahe.pw/uploads/posters/' + item.poster.split('/').pop() : ''}"
               alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span style=font-size:2rem>🎬</span>'">
          <div class="ep-badge">Ep ${item.episode || 1}</div>
        </div>
        <div class="info">
          <div class="title">${escapeHtml(item.anime_title || item.title || 'Unknown')}</div>
          <div class="meta"><span>${item.episode ? 'EP.'+item.episode : ''}</span></div>
        </div>
      </div>
    `).join('');
    homeLoaded = true;
  } catch(e) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load: ${e.message}</p></div>`;
  }
}

// ─── SEARCH ───────────────────────────────
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  showPage('search');
  const grid = document.getElementById('searchGrid');
  const count = document.getElementById('searchCount');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';
  try {
    const data = await api(`/api/search?q=${encodeURIComponent(q)}`);
    const items = data.data || [];
    count.textContent = `${data.total || items.length} result${items.length !== 1 ? 's' : ''}`;
    if (items.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>No anime found for "' + escapeHtml(q) + '"</p></div>';
      return;
    }
    grid.innerHTML = items.map(item => `
      <div class="anime-card" data-action="anime" data-session="${escapeHtml(item.session)}" data-title="${escapeHtml(item.title)}">
        <div class="thumb">
          ${item.poster
            ? `<img src="${item.poster}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span style=font-size:2rem>🎬</span>'">`
            : '<span style="font-size:2rem">🎬</span>'}
          <div class="ep-badge">${item.episodes || '?'}eps</div>
        </div>
        <div class="info">
          <div class="title">${escapeHtml(item.title)}</div>
          <div class="meta">
            <span>${item.type || ''}</span>
            <span>${item.year || ''}</span>
            <span>${item.status || ''}</span>
          </div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Search failed: ${e.message}</p></div>`;
  }
}

// ─── WATCH ────────────────────────────────
async function openAnime(session, title) {
  state.currentAnime = { session, title, episodes: [] };
  showPage('watch');

  document.getElementById('watchHeader').innerHTML = `
    <div class="watch-poster"><img src="" alt="" id="watchPoster" onerror="this.parentElement.innerHTML='<div style=font-size:3rem;text-align:center;padding:20px>🎬</div>'"></div>
    <div class="watch-info">
      <h1 id="watchTitle">${escapeHtml(title)}</h1>
      <div class="meta" id="watchMeta"></div>
      <div class="loading" style="padding:20px 0" id="episodeLoading"><div class="spinner"></div>Loading episodes...</div>
    </div>
  `;

  document.getElementById('episodeGrid').innerHTML = '';
  destroyPlayer();
  showLoading(false);

  try {
    const data = await api(`/api/anime/${session}/episodes`);
    state.currentAnime.episodes = data.episodes || [];
    if (state.currentAnime.episodes.length === 0) {
      document.getElementById('episodeGrid').innerHTML = '<div class="empty-state"><p>No episodes found</p></div>';
      return;
    }
    document.getElementById('watchMeta').textContent = `${state.currentAnime.episodes.length} episodes`;
    document.getElementById('episodeLoading')?.remove();
    renderEpisodeGrid();
    const first = state.currentAnime.episodes[0];
    loadEpisode(first);
  } catch(e) {
    document.getElementById('episodeGrid').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load: ${e.message}</p></div>`;
  }
}

function renderEpisodeGrid() {
  const grid = document.getElementById('episodeGrid');
  const eps = state.currentAnime.episodes;
  grid.innerHTML = eps.map((ep, i) => `
    <div class="episode-btn${ep.episode == (state.currentEpisode?.number || '') ? ' active' : ''}"
         data-action="episode"
         data-number="${escapeHtml(String(ep.episode))}"
         data-session="${escapeHtml(String(ep.session || ep.episode_session || ''))}">
      Ep ${escapeHtml(String(ep.episode))}
    </div>
  `).join('');
}

async function loadEpisode(ep) {
  state.currentEpisode = ep;
  state.currentM3u8 = '';
  state.currentRef = '';

  destroyPlayer();
  showLoading(true);
  clearError();

  // Highlight active
  document.querySelectorAll('.episode-btn').forEach((btn, i) => {
    const eps = state.currentAnime.episodes;
    btn.classList.toggle('active', i < eps.length && eps[i].episode == ep.number);
  });

  try {
    const data = await api(`/api/play/${state.currentAnime.session}/${ep.session}`);
    state.currentStreams = data.streams || [];

    // Update header
    const wt = document.getElementById('watchTitle');
    if (wt) wt.textContent = `${data.anime_title || state.currentAnime.title} — Ep. ${data.episode_num || ep.number}`;
    if (data.poster) {
      const wp = document.getElementById('watchPoster');
      if (wp) wp.src = data.poster;
    }

    // Build stream controls
    buildStreamControls(data);

    // Start playback with best available stream
    const bestStream = state.currentStreams[0];
    if (bestStream) {
      if (bestStream.m3u8) {
        // m3u8 already decoded
        startPlayback(bestStream.m3u8, bestStream.url);
      } else {
        // Need to decode on-demand
        const dec = await api(`/api/decode?url=${encodeURIComponent(bestStream.url)}`);
        if (dec.m3u8) {
          bestStream.m3u8 = dec.m3u8;
          startPlayback(dec.m3u8, bestStream.url);
        } else {
          showError('Failed to extract stream URL');
        }
      }
    } else {
      showError('No streams available');
    }
  } catch(e) {
    showError(e.message);
  }
}

function buildStreamControls(data) {
  const controls = document.getElementById('streamControls');
  if (!controls) return;

  const qualities = [...new Set(state.currentStreams.map(s => s.quality))];
  const audios = [...new Set(state.currentStreams.map(s => s.audio))];

  // Preserve selected values
  const curQ = document.getElementById('qualitySelect')?.value;
  const curA = document.getElementById('audioSelect')?.value;

  controls.innerHTML = `
    <select id="qualitySelect">
      ${qualities.map(q => `<option value="${q}"${q === curQ ? ' selected' : ''}>${q}p</option>`).join('')}
    </select>
    <select id="audioSelect">
      ${audios.map(a => `<option value="${a}"${a === curA ? ' selected' : ''}>${a === 'jpn' ? '🇯🇵 Japanese' : '🇺🇸 English'}</option>`).join('')}
    </select>
    <a class="btn btn-download" id="downloadBtn" target="_blank" style="${data.downloads?.length ? '' : 'display:none'}">
      ⬇ Download
    </a>
  `;

  const dlBtn = document.getElementById('downloadBtn');
  if (dlBtn && data.downloads?.length) {
    dlBtn.href = data.downloads[0].url;
  }
}

async function switchStream() {
  const qs = document.getElementById('qualitySelect');
  const as = document.getElementById('audioSelect');
  if (!qs || !as) return;

  const quality = qs.value;
  const audio = as.value;

  // Normalize types: API may return quality as number (1080) but select returns string ("1080")
  const match = state.currentStreams.find(s => String(s.quality) === quality && s.audio === audio)
             || state.currentStreams.find(s => String(s.quality) === quality)
             || state.currentStreams[0];

  if (!match) return;

  showLoading(true);
  if (match.m3u8) {
    startPlayback(match.m3u8, match.url);
  } else {
    try {
      const dec = await api(`/api/decode?url=${encodeURIComponent(match.url)}`);
      if (dec.m3u8) {
        match.m3u8 = dec.m3u8;
        startPlayback(dec.m3u8, match.url);
      } else {
        showError('Failed to decode this stream');
      }
    } catch(e) {
      showError(e.message);
    }
  }
}

function startPlayback(m3u8Url, kwikUrl) {
  if (!m3u8Url) return;

  // Build proxied stream URL
  state.currentRef = 'https://kwik.cx/';
  const streamUrl = `/api/stream?url=${encodeURIComponent(m3u8Url)}&referer=${encodeURIComponent(state.currentRef)}`;

  state.currentM3u8 = streamUrl;
  destroyPlayer();

  const video = document.getElementById('animeVideo');
  if (!video) return;

  showLoading(true);
  clearError();

  // Prefer native HLS on Safari/iOS (handles AES-128 decryption natively)
  // Fall back to hls.js for other browsers (Chrome, Firefox, etc.)
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Native HLS (Safari, iOS, Edge)
    video.src = streamUrl;
    video.addEventListener('loadedmetadata', () => {
      showLoading(false);
      video.play().catch(() => {});
    });
    video.addEventListener('error', () => {
      showError('Video playback failed');
    });
  } else if (Hls.isSupported()) {
    hlsPlayer = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
    });
    hlsPlayer.loadSource(streamUrl);
    hlsPlayer.attachMedia(video);
    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
      showLoading(false);
      video.play().catch(() => {});
    });
    hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        // MEDIA_ERROR is recoverable via hls.js API, but limit attempts
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR && hlsPlayer && hlsRecoveryCount < 3) {
          hlsRecoveryCount++;
          console.warn(`hls.js MEDIA_ERROR #${hlsRecoveryCount}, recovering...`);
          hlsPlayer.recoverMediaError();
          return;
        }
        console.error('hls.js fatal error:', data.type, data.details);
        showError(`Playback error: ${data.details}`);
      }
    });
  } else {
    showError('HLS is not supported in this browser');
  }
}

function destroyPlayer() {
  if (hlsPlayer) {
    hlsPlayer.destroy();
    hlsPlayer = null;
  }
  hlsRecoveryCount = 0;
  const video = document.getElementById('animeVideo');
  if (video) {
    video.removeAttribute('src');
    video.load();
  }
}

function showLoading(show) {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.classList.toggle('hidden', !show);
}

function showError(msg) {
  showLoading(false);
  // Remove existing error
  clearError();
  const wrapper = document.getElementById('playerWrapper');
  if (!wrapper) return;
  const err = document.createElement('div');
  err.className = 'err-msg';
  err.id = 'playerError';
  err.innerHTML = `
    <div class="icon">⚠️</div>
    <div class="text">${escapeHtml(msg)}</div>
    <button class="retry" data-action="retry">Retry</button>
  `;
  wrapper.appendChild(err);
}

function clearError() {
  const err = document.getElementById('playerError');
  if (err) err.remove();
}

function retryPlayback() {
  if (state.currentEpisode) {
    loadEpisode(state.currentEpisode);
  }
}

// ─── Utility ──────────────────────────────
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ─── Event Delegation ─────────────────────
document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action === 'home') {
    showPage('home');
  } else if (action === 'search') {
    showPage('search');
  } else if (action === 'search-go') {
    doSearch();
  } else if (action === 'anime') {
    openAnime(el.dataset.session, el.dataset.title);
  } else if (action === 'episode') {
    loadEpisode({number: el.dataset.number, session: el.dataset.session});
  } else if (action === 'retry') {
    retryPlayback();
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.id === 'searchInput') {
    doSearch();
  }
});

document.addEventListener('change', function(e) {
  if (e.target.id === 'qualitySelect' || e.target.id === 'audioSelect') {
    switchStream();
  }
});

// ─── Init ─────────────────────────────────
loadHome();
</script>
</body>
